services:
  frontend:
    build:
      context: ./Frontend
      target: build
      args:
        VITE_API_URL: http://localhost:5000
    ports:
      - "3000:5173"
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173
    restart: unless-stopped

  backend:
    build: ./Backend
    ports:
      - "5000:5000"
    env_file:
      - path: ./Backend/.env
        required: false
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongo:27017/chatapp
      - FRONTEND_URL=http://localhost:3000
      - CLIENT_URL=http://localhost:3000
    volumes:
      - ./Backend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
