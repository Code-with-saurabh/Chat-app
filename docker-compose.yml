services:
  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_URL: http://localhost:5000
    ports:
      - "3000:80"
    environment:
      - PORT=80
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./Backend
    ports:
      - "5000:5000"
    env_file:
      - path: ./Backend/.env
        required: false
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongo:27017/chatapp
      - FRONTEND_URL=http://localhost:3000
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
